<style>
  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-family: 'Inter', sans-serif;
    background: var(--surface-page);
    color: var(--text-body);
  }
  :root {
    --paper:               #f2ede6;
    --surface-page:        #F2F2F4;
    --surface-card:        #F8F8F9;
    --surface-elevated:    #EBEBED;
    --cream:               #F2F2F4;
    --sand:                #DCDCDF;
    --red:                 #9b1c1c;
    --lightBlue:           #4c7bd4;
    --mediumBlue:          #2D5FBF;
    --grayBlue:            #4A5A80;
    --navyBlue:            #2D3A5C;
    --darkBlue:            #0D1B3E;
    /* rgba's */
    --nav-scrolled-bg:     rgba(242, 242, 244, 0.96);
    --accent-border:       rgba(79, 142, 247, 0.35);
    --darkBlue-muted:      rgba(45, 58, 92, 0.45);
    --nav-scrolled-shadow: rgba(13, 15, 20, 0.06);
  }
  .card {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  /* ── Full-bleed background ── */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('/Users/home/Documents/sites/rickallen/assets/img/hero-img.png');
    background-size: cover;
    background-position: center 52%;
    background-repeat: no-repeat;
  }
  .bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      160deg,
      rgba(8, 5, 7, 0.80) 80%,
      rgba(8, 5, 7, 0.85) 85%,
      rgba(8, 5, 7, 0.90) 90%
    );
  }
  /* ── Main content ── */
  .main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 23%;
    padding-left: 6%;
  }
  .cover-eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow-rule {
    width: 45px;
    height: 2px;
    background: var(--peach);
    flex-shrink: 0;
    background: linear-gradient(to left, rgb(129, 46, 46), rgb(159, 74, 74), rgb(150, 91, 91));
  }
  .eyebrow-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: rgba(242, 242, 244, 0.7);
  }
  .lowercase {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 800;
    padding: 0;
    margin: 0;
    text-transform: lowercase;
  }
  .cover-head {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 6rem;
    font-weight: 600;
    color: var(--paper);
    line-height: 1.0;
  }
  .cover-head span {
    color: var(--red);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="bg"></div>
      <div class="bg-overlay"></div>

    <div class="main">
      <div class="cover-eyebrow">
        <div class="eyebrow-rule"></div>
        <div class="eyebrow-label">IN <span class="lowercase">v.</span> Richard Allen</div>
      </div>
      <div class="cover-head">The Case Against Rick</div>
    </div>

</body>
