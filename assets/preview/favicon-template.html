<style>
  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  body {
    width: 700px;
    height: 700px;
    font-family: 'Inter', sans-serif;
  }
  :root {
    --paper:               #f2ede6;
    --surface-page:        #F2F2F4;
    --surface-card:        #F8F8F9;
    --surface-elevated:    #EBEBED;
    --cream:               #F2F2F4;
    --sand:                #DCDCDF;
    --red:                 #9b1c1c;
    --lightBlue:           #4c7bd4;
    --mediumBlue:          #2D5FBF;
    --grayBlue:            #4A5A80;
    --navyBlue:            #2D3A5C;
    --darkBlue:            #0D1B3E;
    /* rgba's */
    --nav-scrolled-bg:     rgba(242, 242, 244, 0.96);
    --accent-border:       rgba(79, 142, 247, 0.35);
    --darkBlue-muted:      rgba(45, 58, 92, 0.45);
    --nav-scrolled-shadow: rgba(13, 15, 20, 0.06);
  }
  /* ── Main content ── */
  .main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: #0a0a0a;
    text-align: center;
  }
  .cover-head-1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 250px;
    font-weight: 600;
    color: var(--paper);
    text-transform: uppercase;
  }
  .cover-head-2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 150px;
    font-weight: 500;
    color: var(--red);
    text-transform: lowercase;
    margin-top: -12%;
    margin-bottom: -11%;
  }
  .cover-head-3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 250px;
    font-weight: 600;
    color: var(--paper);
    text-transform: uppercase;
  }
</style>
</head>
<body>

    <div class="main">

      <div class="cover-head-1">IN</div>
      <div class="cover-head-2">vs.</div>
      <div class="cover-head-3">RA</div>
    
    </div>
