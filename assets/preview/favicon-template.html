<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 700px;
    height: 700px;
    font-family: 'Inter', sans-serif;
    background: #f0e8dc;
    overflow: hidden;
    position: relative;
  }
  :root {
    --paper:               #f2ede6;
    --surface-page:        #F2F2F4;
    --surface-card:        #F8F8F9;
    --surface-elevated:    #EBEBED;
    --cream:               #F2F2F4;
    --sand:                #DCDCDF;
    --red:                 #9b1c1c;
    --lightBlue:           #4c7bd4;
    --mediumBlue:          #2D5FBF;
    --grayBlue:            #4A5A80;
    --navyBlue:            #2D3A5C;
    --darkBlue:            #0D1B3E;
    --nav-scrolled-bg:     rgba(242, 242, 244, 0.96);
    --accent-border:       rgba(79, 142, 247, 0.35);
    --darkBlue-muted:      rgba(45, 58, 92, 0.45);
    --nav-scrolled-shadow: rgba(13, 15, 20, 0.06);
  }
  /* ── Top label ── */
  .top-label {
    position: absolute;
    top: 38px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 28px;
    color: #9b1c1c;
    letter-spacing: 0.28em;
  }
  /* ── Top double rule ── */
  .rule-top {
    position: absolute;
    top: 84px;
    left: 35px;
    right: 35px;
    z-index: 2;
  }
  .rule-top::before {
    content: '';
    display: block;
    height: 9px;
    background: #0e0e0f;
    margin-bottom: 4px;
  }
  .rule-top::after {
    content: '';
    display: block;
    height: 4px;
    background: #0e0e0f;
  }
  /* ── AE headline ── */
  .headline {
    position: absolute;
    top: 76px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 420px;
    line-height: 1;
    color: #0e0e0f;
    z-index: 1;
  }
  /* ── Bottom double rule ── */
  .rule-bottom {
    position: absolute;
    top: 437px;
    left: 35px;
    right: 35px;
    z-index: 2;
  }
  .rule-bottom::before {
    content: '';
    display: block;
    height: 4px;
    background: #0e0e0f;
    margin-bottom: 5px;
  }
  .rule-bottom::after {
    content: '';
    display: block;
    height: 9px;
    background: #0e0e0f;
  }
  /* ── Red accent band ── */
  .red-band {
    position: absolute;
    top: 459px;
    left: 35px;
    right: 35px;
    height: 17px;
    background: #9b1c1c;
  }
  /* ── Dateline ── */
  .dateline {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 46px;
    color: #5a3535;
    letter-spacing: 0.13em;
  }
  .dateline-1 { 
    top: 538px; 
  }
  .dateline-2 { 
    top: 604px; 
    font-size: 22px;
    }
</style>
</head>
<body>

    <div class="top-label">ALL EYES ON DELPHI</div>
    <div class="rule-top"></div>
    <div class="headline">AE</div>
    <div class="rule-bottom"></div>
    <div class="red-band"></div>
    <div class="dateline dateline-1">IN vs. Rick Allen</div>
    <div class="dateline dateline-2">alleyesondelphi.github.io/rickallen</div>

</body>
</html>
