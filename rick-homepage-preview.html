<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap');

  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  body {
    width: 1200px;
    height: 675px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --ink:   #0e0e0f;
    --paper: #f2ede6;
    --aged:  #e0d8cc;
    --red:   #9b1c1c;
    --steel: #3a4a5c;
    --muted: #aaa199;
  }
  .card {
    width: 1200px;
    height: 675px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    z-index: 10;
    background: linear-gradient(to right, #4a0e0e, #9b1c1c, #c0392b, #9b1c1c, #4a0e0e);
  }

  /* ── Full-bleed background ── */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('/Users/home/Documents/sites/rickallen/assets/img/hero-img.png');
    background-size: cover;
    background-position: center top;
    filter: grayscale(30%) contrast(0.75) brightness(0.55);
  }
  .bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      160deg,
      rgba(8, 5, 7, 0.78) 0%,
      rgba(8, 5, 7, 0.65) 50%,
      rgba(8, 5, 7, 0.90) 100%
    );
  }
  /* ── Top bar ── */
  .top-bar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 52px;
    border-bottom: 1px solid rgba(224, 216, 204, 0.15);
  }
  .top-brand {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper);
    opacity: 0.9;
    margin-top: -0.5%;
  }
  .top-nav {
    display: flex;
    gap: 25px;
  }
  .top-nav span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(242, 237, 230, 0.45);
    font-weight: 600;
    padding: 4px 10px;
  }
  .top-nav span.active {
    color: var(--paper);
    padding: 4px 10px;
    border: 2px solid rgba(155, 28, 28, 0.6);
  }
  /* ── Main content ── */
  .main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 52px 44px;
  }
  .cover-eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .eyebrow-rule {
    width: 28px;
    height: 2px;
    background: var(--red);
    flex-shrink: 0;
  }
  .eyebrow-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242, 237, 230, 0.6);
  }
  .cover-head {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 3rem;
    font-weight: 800;
    color: var(--paper);
    line-height: 1.0;
    margin-bottom: 2%;
  }
  .cover-head em {
    font-style: italic;
    font-weight: 700;
    color: rgba(242, 237, 230, 0.55);
  }
  .cover-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 11%;
  }
  /* ── Bottom strip ── */
  .bottom-strip {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 52px;
    background: rgba(242, 237, 230, 0.06);
    border-top: 1px solid rgba(224, 216, 204, 0.15);
  }
  .tags {
    display: flex;
    gap: 15px;
    margin-left: -1%;
  }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid rgba(224, 216, 204, 0.2);
  }
  .case-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid rgba(224, 216, 204, 0.4);
    margin-right: -1%;
  }
</style>
</head>
<body>

<div class="card">
  <div class="bg"></div>
  <div class="bg-overlay"></div>

  <div class="top-bar">
    <span class="top-brand">All Eyes on Delphi</span>
    <div class="top-nav">
      <span>Court Docs</span>
      <span>Transcripts</span>
      <span>Exhibits</span>
      <span>Analysis</span>
      <span class="active">Timelines</span>
    </div>
  </div>

  <div class="main">
    <div class="cover-eyebrow">
      <div class="eyebrow-rule"></div>
      <span class="eyebrow-label">Indiana v. Richard Allen</span>
    </div>
    <div class="cover-head">The Case Against Rick</div>
    <div class="cover-sub">Court documents, transcripts, exhibits.</div>
  </div>

  <div class="bottom-strip">
    <div class="tags">
      <span class="tag">Court Filings</span>
      <span class="tag">Transcripts</span>
      <span class="tag">Exhibits</span>
      <span class="tag">Analysis</span>
      <span class="tag">Timelines</span>
    </div>
    <span class="case-num">08C01-2210-MR-1 &nbsp;|&nbsp; 25A-CR-591</span>
  </div>
</div>

</body></html>
