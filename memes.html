      border-bottom: 1px solid transparent;
    }
    .site-nav.scrolled {
      padding: 14px 5vw;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-color: var(--border-light);
      box-shadow: 0 1px 12px var(--nav-scrolled-shadow);

      text-decoration: none;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-brand { 
      color: var(--ink); 
    }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      color: rgba(255,255,255,0.8);
      margin-left: auto;
      transition: color 0.3s;

      font-weight: 500;

      color: var(--text-label); 
    }
    .site-nav.scrolled .nav-links a:hover { 
      color: var(--ink); 
    }
    .site-nav.scrolled .nav-links a.active { 
      color: var(--accent); 
    }

      height: 80vh;
      min-height: 520px;
      overflow: hidden;
    }

      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }

      content: '';
      position: absolute;

        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.70) 60%,

      height: 1.5px;

      font-weight: 800;
      color: var(--text-heading);
    }
    .case-body {
      padding: 28px;
    }
    /* ── Nav cards ── */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .media-card {
      display: block;
      text-decoration: none;
      border: 1px solid var(--border-light);
      border-radius: 0;
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;

    .media-card:hover {

      display: block;
    }

      background: var(--surface-elevated);
      border-top: 1px solid var(--border-mid);

      margin-bottom: 16px;

      transition: color 0.2s;
    }
    .footer-social a:hover {

    @media (max-width: 720px) {

        left: 0;

        flex-direction: column;
        background: var(--surface-page);
        border-bottom: 1px solid var(--border-light);
        padding: 12px 20px 16px;
        gap: 0;
        box-shadow: 0 4px 16px rgba(36,22,32,0.08);
      }
      .nav-links.open { 
        display: flex; 
      }
      .nav-links li { 
        padding: 8px 0; 
        border-bottom: 1px solid var(--border-mid); 
      }
      .nav-links li:last-child { 
        border-bottom: none; 
      }
      .nav-links a { 
        font-size: 10px !important; 
        letter-spacing: 0.08em !important; 
        color: var(--text-label) !important; 
      }
      .nav-links a.active { 
        color: var(--accent) !important; 
      }
      .nav-links a:hover { 
        color: var(--ink) !important; 
      }
      .masthead { 
        height: 55vh; min-height: 340px; 
      }
      .masthead-text { 
        left: 20px; bottom: 52px; 
      }
      .content-section { 
        padding: 32px 16px 56px; 
      }
      .media-grid { 
        grid-template-columns: 1fr; 
      }
      .meme-gallery { 
        columns: 2; 
      }
      .case-body { 
        padding: 20px 16px; 
      }
    }
    @media (max-width: 480px) {
      .meme-gallery { columns: 1; }
