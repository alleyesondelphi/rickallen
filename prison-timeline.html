  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --peach:               #2D5FBF;
      --cream:               #F2F2F4;
      --sand:                #DCDCDF;
      --plum:                #0D1B3E;
      --carmine:             #4A5A80;
      --ink:                 #0D1B3E;
      --surface-page:        #F2F2F4;
      --surface-card:        #F8F8F9;
      --surface-elevated:    #EBEBED;
      --text-heading:        #0D1B3E;
      --text-body:           #2D3A5C;
      --text-label:          #4A5A80;
      --text-muted:          rgba(45, 58, 92, 0.45);
      --accent:              #2D5FBF;
      --accent-border:       rgba(155, 28, 28, 0.40);
      --border-light:        rgba(46, 54, 80, 0.18);
      --border-mid:          rgba(46, 54, 80, 0.10);
      --nav-scrolled-bg:     rgba(242, 242, 244, 0.96);
      --nav-scrolled-shadow: rgba(13, 15, 20, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface-page:        #121212;
        --surface-card:        #1c1c1c;
        --surface-elevated:    #242424;
        --text-heading:        #f2ede6;
        --text-body:           #cac3b9;
        --text-label:          #9292BE;
        --text-muted:          rgba(202, 195, 185, 0.90);
        --accent:              #c23535;
        --accent-border:       rgba(155, 28, 28, 0.35);
        --border-light:        rgba(242, 237, 230, 0.08);
        --border-mid:          rgba(255, 255, 255, 0.03);
        --carmine:             #cdc6bc;
        --ink:                 #f2ede6;
        --peach:               #c23535;

      --gold:               #d4a520;
        --nav-scrolled-bg:     rgba(18, 18, 18, 0.97);
        --nav-scrolled-shadow: rgba(0, 0, 0, 0.40);
      }
    }
    :root[data-theme="dark"] {
      --surface-page:        #121212;
      --surface-card:        #1c1c1c;
      --surface-elevated:    #242424;
      --text-heading:        #f2ede6;
      --text-body:           #cac3b9;
      --text-label:          #9292BE;
      --text-muted:          rgba(184, 176, 164, 0.65);
      --accent:              #c23535;
      --accent-border:       rgba(155, 28, 28, 0.35);
      --border-light:        rgba(242, 237, 230, 0.08);
      --border-mid:          rgba(255, 255, 255, 0.03);
      --carmine:             #cdc6bc;
      --ink:                 #f2ede6;
      --peach:               #c23535;

      --gold:               #d4a520;
      --nav-scrolled-bg:     rgba(18, 18, 18, 0.97);
      --nav-scrolled-shadow: rgba(0, 0, 0, 0.40);
    }
    html { 
      scroll-behavior: smooth; 
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface-page);
      color: var(--text-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* ── Nav ── */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 5vw;
      transition: background 0.3s, padding 0.3s, border-color 0.3s, box-shadow 0.3s;
      border-bottom: 1px solid transparent;
    }
    .site-nav.scrolled {
      padding: 14px 5vw;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-color: var(--border-light);
      box-shadow: 0 1px 12px var(--nav-scrolled-shadow);
    }
    .nav-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-brand { 
      color: var(--ink); 
    }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      color: rgba(255,255,255,0.8);
      margin-left: auto;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-toggle { 
      color: var(--ink); 
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 40px;
    }
    .nav-links a {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { 
      color: #fff; 
    }
    .nav-links a.active { 
      color: var(--peach); 
    }
    .site-nav.scrolled .nav-links a { 
      color: var(--text-label); 
    }
    .site-nav.scrolled .nav-links a:hover { 
      color: var(--ink); 
    }
    .site-nav.scrolled .nav-links a.active { 
      color: var(--accent); 
    }
    /* ── Masthead ── */
    .masthead {
      position: relative;
      height: 80vh;
      min-height: 520px;
      overflow: hidden;
    }
    .masthead-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center 52%;
    }
    .masthead::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.52)  0%,
        rgba(0, 0, 0, 0.18) 45%,
        rgba(0, 0, 0, 0.38) 100%
      );
    }
    .masthead-text {
      position: absolute;
      bottom: 72px;
      left: 5vw;
      z-index: 2;
    }
    .masthead-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(242, 237, 230, 0.68);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .masthead-kicker::before {
      content: '';
      width: 22px;
      height: 1.5px;
      background: linear-gradient(to left, rgb(129, 46, 46), rgb(159, 74, 74), rgb(150, 91, 91));
      flex-shrink: 0;
    }
    .masthead-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 24px rgba(36,22,32,0.5);
    }
    /* ── Content ── */
    .content-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 5vw 88px;
    }
    /* ── Case info card ── */
    .case-block {
      background: var(--surface-card);
      border: 1px solid var(--border-mid);
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 32px;
    }
    .case-title-bar {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border-light);
    }
    .case-title-bar h2 {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(1.1rem, 1.6vw, 1.35rem);
      font-weight: 800;
      color: var(--text-heading);
    }
    .case-meta {
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 40px;
    }
    .case-meta-item {
      font-size: 13px;
      line-height: 1.6;
    }
    .case-meta-item strong {
      color: var(--text-heading);
      font-weight: 600;
    }
    /* ── Month sections (collapsible) ── */
    details.month-details {
      background: var(--surface-card);
      border: 1px solid var(--border-mid);
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      transition: box-shadow 0.3s;
    }
    details.month-details:hover {
      box-shadow: 0 8px 28px rgba(0,0,0,0.10), 0 0 0 1px var(--accent-border);
    }
    summary.month-summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      background: var(--surface-card);
      border-bottom: 1px solid transparent;
    }
    details.month-details[open] > summary.month-summary {
      border-bottom-color: var(--border-light);
    }
    summary.month-summary::-webkit-details-marker { 
      display: none; 
    }
    summary.month-summary::before {
      content: '▼';
      display: inline-flex;
      width: 18px;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    details.month-details:not([open]) > summary.month-summary::before {
      transform: rotate(-90deg);
    }
    summary.month-summary h2 {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      font-weight: 800;
      color: var(--text-heading);
      margin: 0;
    }
    /* ── Document items ── */
    .doc-item {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border-light);
    }
    .doc-item:last-child { 
      border-bottom: none; 
    }
    .doc-note {
      margin-bottom: 14px;
      padding: 12px 18px;
      background: var(--surface-elevated);
      border-left: 3px solid var(--accent);
      border-radius: 0;
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-body);
    }
    .pdf-embed {
      width: 100%;
      aspect-ratio: 11 / 8.5;
      border: none;
      border-radius: 6px;
      background: var(--surface-elevated);
    }
    /* ── Footer ── */
    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px 5vw;
      border-top: 1px solid var(--border-light);
    }
    .footer-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .footer-social {
      display: flex;
      gap: 20px;
    }
    .footer-social a {
      color: var(--text-muted);
      font-size: 15px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-social a:hover { 
      color: var(--carmine); 
    }
    /* ── Responsive ── */
    @media (max-width: 900px) {
      .case-meta { 
        grid-template-columns: 1fr; 
        gap: 8px; 
      }
    }
    @media (max-width: 720px) {
      .nav-toggle { 
        display: block; 
      }
      .site-nav, .site-nav.scrolled { 
        padding: 12px 16px; 
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%; 
        left: 0; 
        right: 0;
        flex-direction: column;
        background: var(--surface-page);
        border-bottom: 1px solid var(--border-light);
        padding: 12px 20px 16px;
        gap: 0;
        box-shadow: 0 4px 16px rgba(36,22,32,0.08);
      }
      .nav-links.open { 
        display: flex; 
      }
      .nav-links li { 
        padding: 8px 0; 
        border-bottom: 1px solid var(--border-mid); 
      }
      .nav-links li:last-child { 
        border-bottom: none; 
      }
      .nav-links a { 
        font-size: 10px !important; 
        letter-spacing: 0.08em !important; 
        color: var(--text-label) !important; 
      }
      .nav-links a.active { 
        color: var(--accent) !important; 
      }
      .nav-links a:hover { 
        color: var(--ink) !important; 
      }
      .masthead { 
        height: 55vh; 
        min-height: 340px; 
      }
      .masthead-img { 
        object-fit: cover; 
        object-position: center top; 
      }
      .masthead-text { 
        left: 20px; 
        bottom: 52px; 
      }
      .content-section { 
        padding: 32px 16px 56px; 
      }
      .case-meta { 
        padding: 18px 20px; 
      }
      .doc-item { 
        padding: 16px 20px; 
      }
      .doc-note { 
        padding: 10px 14px; 
        font-size: 12px; 
      }
      .pdf-embed { 
        aspect-ratio: 8.5 / 11; 
      }
    }
    @media (max-width: 450px) {
      .masthead-img { 
        object-fit: contain; 
        object-position: center 50%; 
      }
    }
  </style>
  <style>
    /* dark mode: gold accents */
    @media (prefers-color-scheme: dark) {
      /* active nav → gold */
      :root:not([data-theme="light"]) .nav-links a.active,
      :root:not([data-theme="light"]) .site-nav.scrolled .nav-links a.active { color: var(--gold); }
      /* filing-note: gold stripe + aged tint */
      :root:not([data-theme="light"]) .filing-note {
        background: #e0d8cc;
        border-image: linear-gradient(to bottom, rgb(129, 46, 46), rgb(159, 74, 74), rgb(150, 91, 91)) 1;
        color: #2d2925;
      }
      /* month card hover: editorial shadow, no ring */
      :root:not([data-theme="light"]) details.month-details:hover {
        box-shadow: 0 6px 24px rgba(0,0,0,0.28);
        border-color: rgba(242, 237, 230, 0.13);
      }
      /* accordion triangle → gold */
      :root:not([data-theme="light"]) summary.month-summary::before { color: #e0d8cc; }
      /* section dividers → visible warm paper line */
      :root:not([data-theme="light"]) .case-title-bar,
      :root:not([data-theme="light"]) details.month-details[open] > summary.month-summary {
        border-bottom-color: rgba(242, 237, 230, 0.22);
      }
      /* filing row separators → warmer aged-tint line */
      :root:not([data-theme="light"]) .filing {
        border-bottom-color: rgba(224, 216, 204, 0.14);
      }
    }
    :root[data-theme="dark"] .nav-links a.active,
    :root[data-theme="dark"] .site-nav.scrolled .nav-links a.active { color: var(--gold); }
    :root[data-theme="dark"] .filing-note {
      background: #e0d8cc;
      border-image: linear-gradient(to bottom, rgb(129, 46, 46), rgb(159, 74, 74), rgb(150, 91, 91)) 1;
      color: #2d2925;
    }
    :root[data-theme="dark"] details.month-details:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,0.28);
      border-color: rgba(242, 237, 230, 0.13);
    }
    :root[data-theme="dark"] summary.month-summary::before { color: #e0d8cc; }
    :root[data-theme="dark"] .case-title-bar,
    :root[data-theme="dark"] details.month-details[open] > summary.month-summary {
      border-bottom-color: rgba(242, 237, 230, 0.22);
    }
    :root[data-theme="dark"] .filing {
      border-bottom-color: rgba(224, 216, 204, 0.14);
    }
  </style>
</head>
