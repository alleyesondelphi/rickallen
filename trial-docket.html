  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --peach:               #2D5FBF;
      --cream:               #F2F2F4;
      --sand:                #DCDCDF;
      --plum:                #0D1B3E;
      --carmine:             #4A5A80;
      --ink:                 #0D1B3E;
      --surface-page:        #F2F2F4;
      --surface-card:        #F8F8F9;
      --surface-elevated:    #EBEBED;
      --text-heading:        #0D1B3E;
      --text-body:           #2D3A5C;
      --text-label:          #4A5A80;
      --text-muted:          rgba(45, 58, 92, 0.45);
      --accent:              #2D5FBF;
      --accent-border:       rgba(79, 142, 247, 0.35);
      --border-light:        rgba(46, 54, 80, 0.18);
      --border-mid:          rgba(46, 54, 80, 0.10);
      --nav-scrolled-bg:     rgba(242, 242, 244, 0.96);
      --nav-scrolled-shadow: rgba(13, 15, 20, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface-page:        #0E0E10;
        --surface-card:        #1A1A1E;
        --surface-elevated:    #242428;
        --text-heading:        #EAEAEC;
        --text-body:           #9898A4;
        --text-label:          #9292BE;
        --text-muted:          rgba(152, 152, 164, 0.95);
        --accent:              #4F8EF7;
        --accent-border:       rgba(79, 142, 247, 0.30);
        --border-light:        rgba(255, 255, 255, 0.07);
        --border-mid:          rgba(255, 255, 255, 0.04);
        --carmine:             #9292BE;
        --ink:                 #EAEAEC;
        --peach:               #4F8EF7;
        --nav-scrolled-bg:     rgba(14, 14, 16, 0.96);
        --nav-scrolled-shadow: rgba(0, 0, 0, 0.40);
      }
    }
    :root[data-theme="dark"] {
      --surface-page:        #0E0E10;
      --surface-card:        #1A1A1E;
      --surface-elevated:    #242428;
      --text-heading:        #EAEAEC;
      --text-body:           #9898A4;
      --text-label:          #9292BE;
      --text-muted:          rgba(152, 152, 164, 0.65);
      --accent:              #4F8EF7;
      --accent-border:       rgba(79, 142, 247, 0.30);
      --border-light:        rgba(255, 255, 255, 0.07);
      --border-mid:          rgba(255, 255, 255, 0.04);
      --carmine:             #9292BE;
      --ink:                 #EAEAEC;
      --peach:               #4F8EF7;
      --nav-scrolled-bg:     rgba(14, 14, 16, 0.96);
      --nav-scrolled-shadow: rgba(0, 0, 0, 0.40);
    }
    html { 
      scroll-behavior: smooth; 
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface-page);
      color: var(--text-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* ── Nav ── */
    .site-nav {
      position: fixed;
      top: 0; 
      left: 0; 
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 5vw;
      transition: background 0.3s, padding 0.3s, border-color 0.3s, box-shadow 0.3s;
      border-bottom: 1px solid transparent;
    }
    .site-nav.scrolled {
      padding: 14px 5vw;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-color: var(--border-light);
      box-shadow: 0 1px 12px var(--nav-scrolled-shadow);
    }
    .nav-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-brand { 
      color: var(--ink); 
    }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      color: rgba(255,255,255,0.8);
      margin-left: auto;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-toggle { 
      color: var(--ink); 
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 40px;
    }
    .nav-links a {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { 
      color: #fff; 
    }
    .nav-links a.active { 
      color: var(--peach); 
    }
    .site-nav.scrolled .nav-links a { 
      color: var(--text-label); 
    }
    .site-nav.scrolled .nav-links a:hover { 
      color: var(--ink); 
    }
    .site-nav.scrolled .nav-links a.active { 
      color: var(--accent); 
    }
    /* ── Masthead ── */
    .masthead {
      position: relative;
      height: 80vh;
      min-height: 520px;
      overflow: hidden;
    }
    .masthead-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center 52%;
    }
    .masthead::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.52)  0%,
        rgba(0, 0, 0, 0.18) 45%,
        rgba(0, 0, 0, 0.38) 100%
      );
    }
    .masthead-text {
      position: absolute;
      bottom: 72px;
      left: 5vw;
      z-index: 2;
    }
    .masthead-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--peach);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .masthead-kicker::before {
      content: '';
      width: 22px;
      height: 1.5px;
      background: var(--peach);
      flex-shrink: 0;
    }
    .masthead-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 24px rgba(36,22,32,0.5);
    }
    /* ── Content ── */
    .content-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 5vw 88px;
    }
    /* ── Case info card ── */
    .case-block {
      background: var(--surface-card);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 32px;
    }
    .case-title-bar {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border-light);
    }
    .case-title-bar h2 {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(1.1rem, 1.6vw, 1.35rem);
      font-weight: 800;
      color: var(--text-heading);
    }
    .case-meta {
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 40px;
    }
    .case-meta-item {
      font-size: 13px;
      line-height: 1.6;
    }
    .case-meta-item strong {
      color: var(--text-heading);
      font-weight: 600;
    }
    /* ── Month sections (collapsible) ── */
    details.month-details {
      background: var(--surface-card);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      transition: box-shadow 0.3s;
    }
    details.month-details:hover {
      box-shadow: 0 8px 28px rgba(0,0,0,0.10), 0 0 0 1px var(--accent-border);
    }
    summary.month-summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      background: var(--surface-card);
      border-bottom: 1px solid transparent;
    }
    details.month-details[open] > summary.month-summary {
      border-bottom-color: var(--border-light);
    }
    summary.month-summary::-webkit-details-marker { 
      display: none; 
    }
    summary.month-summary::before {
      content: '▼';
      display: inline-flex;
      width: 18px;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    details.month-details:not([open]) > summary.month-summary::before {
      transform: rotate(-90deg);
    }
    summary.month-summary h2 {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      font-weight: 800;
      color: var(--text-heading);
      margin: 0;
    }
    /* ── Filings list ── */
    .filing {
      display: flex;
      gap: 24px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border-light);
      font-size: 14px;
      line-height: 1.7;
    }
    .filing:last-child { 
      border-bottom: none; 
    }
    .filing-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text-label);
      font-weight: 500;
      flex-shrink: 0;
      min-width: 75px;
      letter-spacing: 0.05em;
    }
    .filing-content { 
      flex: 1; 
    }
    .filing-link {
      color: var(--carmine);
      font-weight: 600;
      text-underline-offset: 2px;
    }
    .filing-link:hover { 
      color: var(--ink); 
    }
    .filing-bold {
      font-weight: 600;
      color: var(--text-heading);
    }
    .filing-note {
      margin-top: 8px;
      padding: 14px 20px;
      background: var(--surface-elevated);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-body);
    }
    /* ── Drive card ── */
    .drive-card {
      background: var(--surface-card);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-decoration: none;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .drive-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.10), 0 0 0 1px var(--accent-border);
    }
    .drive-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
      font-size: 20px;
    }
    .drive-card-body { 
      flex: 1; 
    }
    .drive-card-title {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 4px;
    }
    .drive-card-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-body);
    }
    .drive-card-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      flex-shrink: 0;
      transition: color 0.2s, gap 0.2s;
    }
    .drive-card-cta:hover {
      color: var(--ink);
    }
    .drive-card:hover .drive-card-cta {
      color: var(--ink);
      gap: 10px;
    }
    /* ── Footer ── */
    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px 5vw;
      border-top: 1px solid var(--border-light);
    }
    .footer-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .footer-social {
      display: flex;
      gap: 20px;
    }
    .footer-social a {
      color: var(--text-muted);
      font-size: 15px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-social a:hover { 
      color: var(--carmine); 
    }
    /* ── Responsive ── */
    @media (max-width: 900px) {
      .case-meta { 
        grid-template-columns: 1fr; 
        gap: 8px; 
      }
    }
    @media (max-width: 720px) {
      .nav-toggle { 
        display: block; 
      }
      .site-nav, .site-nav.scrolled { 
        padding: 12px 16px; 
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%; 
        left: 0; 
        right: 0;
        flex-direction: column;
        background: var(--surface-page);
        border-bottom: 1px solid var(--border-light);
        padding: 12px 20px 16px;
        gap: 0;
        box-shadow: 0 4px 16px rgba(36,22,32,0.08);
      }
      .nav-links.open { 
        display: flex; 
      }
      .nav-links li { 
        padding: 8px 0; 
        border-bottom: 1px solid var(--border-mid); 
      }
      .nav-links li:last-child { 
        border-bottom: none; 
      }
      .nav-links a { 
        font-size: 10px !important; 
        letter-spacing: 0.08em !important; 
        color: var(--text-label) !important; 
      }
      .nav-links a.active { 
        color: var(--accent) !important; 
      }
      .nav-links a:hover { 
        color: var(--ink) !important; 
      }
      .masthead {
        height: 55vh;
        min-height: 340px;
      }
      .masthead-img {
        object-fit: cover;
        object-position: center top;
      }
      .masthead-text {
        left: 20px;
        bottom: 52px;
      }
      .content-section { 
        padding: 32px 16px 56px; 
      }
      .case-meta { 
        padding: 18px 20px; 
      }
      .filing { 
        padding: 14px 20px; 
        font-size: 13px; 
        gap: 16px; 
      }
      .filing-date { 
        font-size: 11px; 
        min-width: 65px; 
      }
      .filing-note { 
        padding: 12px 16px; 
        font-size: 12px; 
      }
    }
    @media (max-width: 450px) {
      .masthead-img { 
        object-fit: contain; 
        object-position: center 50%; 
      }
    }
    /* ── PDF embed ── */
    .doc-item {
      padding: 20px 20px;
      border-bottom: 1px solid var(--border-light);
    }
    .doc-item:last-child { 
      border-bottom: none; 
    }
    .doc-note {
      font-size: 0.8rem;
      color: var(--text-label);
      margin-bottom: 14px;
      line-height: 1.6;
      padding: 1% 2%;
    }
    .pdf-embed {
      width: 100%;
      aspect-ratio: 11 / 8.5;
      min-height: 420px;
    }
    .pdf-embed iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
      background: var(--surface-elevated);
    }
    @media (max-width: 600px) {
      .pdf-embed { 
        min-height: 520px; 
        aspect-ratio: 8.5 / 11; 
      }
      .doc-item { 
        padding: 16px 16px; 
      }
    }
</style>
</head>

  <section class="content-section">

      </div>
    </details>

  </section>

  <footer class="site-footer">
    <span class="footer-brand">All Eyes on Delphi</span>
    <div class="footer-social">
      <a href="https://www.x.com/alleyesondelphi" target="_blank" aria-label="X/Twitter"><i class="bi bi-twitter-x"></i></a>
      <a href="https://www.youtube.com/alleyesondelphi" target="_blank" aria-label="YouTube"><i class="bi bi-youtube"></i></a>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script>
    AOS.init({ duration: 600, once: true, offset: 60 });
    const nav = document.getElementById('siteNav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    });
  </script>
</body>
