<!DOCTYPE html>

<head>

  <!-- Favicons -->
  <link href="https://alleyesondelphi.github.io/rickallen/assets/icons/favicon.ico" rel="icon" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="https://alleyesondelphi.github.io/rickallen/assets/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --peach:               #9b1c1c;
      --cream:               #F2F2F4;
      --sand:                #DCDCDF;
      --plum:                #0e0e0f;
      --carmine:             #7a3535;
      --ink:                 #0e0e0f;
      --surface-page:        #F2F2F4;
      --surface-card:        #F8F8F9;
      --surface-elevated:    #EBEBED;
      --text-heading:        #0e0e0f;
      --text-body:           #2d2925;
      --text-label:          #6b6560;
      --text-muted:          rgba(45, 41, 37, 0.45);
      --accent:              #9b1c1c;
      --accent-border:       rgba(155, 28, 28, 0.40);
      --border-light:        rgba(14, 14, 15, 0.12);
      --border-mid:          rgba(14, 14, 15, 0.06);
      --gold:                #b8860b;
      --nav-scrolled-bg:     rgba(242, 242, 244, 0.96);
      --nav-scrolled-shadow: rgba(13, 15, 20, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface-page:        #121212;
        --surface-card:        #1c1c1c;
        --surface-elevated:    #242424;
        --text-heading:        #f2ede6;
        --text-body:           #cac3b9;
        --text-label:          #9b8c7e;
        --text-muted:          rgba(202, 195, 185, 0.90);
        --accent:              #c23535;
        --accent-border:       rgba(155, 28, 28, 0.35);
        --border-light:        rgba(242, 237, 230, 0.08);
        --border-mid:          rgba(255, 255, 255, 0.03);
        --carmine:             #cdc6bc;
        --ink:                 #f2ede6;
        --peach:               #c23535;
        --gold:                #d4a520;
        --nav-scrolled-bg:     rgba(18, 18, 18, 0.97);
        --nav-scrolled-shadow: rgba(0, 0, 0, 0.40);
      }
    }
    :root[data-theme="dark"] {
      --surface-page:        #121212;
      --surface-card:        #1c1c1c;
      --surface-elevated:    #242424;
      --text-heading:        #f2ede6;
      --text-body:           #cac3b9;
      --text-label:          #9b8c7e;
      --text-muted:          rgba(202, 195, 185, 0.90);
      --accent:              #c23535;
      --accent-border:       rgba(155, 28, 28, 0.35);
      --border-light:        rgba(242, 237, 230, 0.08);
      --border-mid:          rgba(255, 255, 255, 0.03);
      --carmine:             #cdc6bc;
      --ink:                 #f2ede6;
      --peach:               #c23535;
      --gold:                #d4a520;
      --nav-scrolled-bg:     rgba(18, 18, 18, 0.97);
      --nav-scrolled-shadow: rgba(0, 0, 0, 0.40);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface-page);
      color: var(--text-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* ── Nav ── */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 5vw;
      transition: background 0.3s, padding 0.3s, border-color 0.3s, box-shadow 0.3s;
      border-bottom: 1px solid transparent;
    }
    .site-nav.scrolled {
      padding: 14px 5vw;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-color: var(--border-light);
      box-shadow: 0 1px 12px var(--nav-scrolled-shadow);
    }
    .nav-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-brand { color: var(--ink); }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      color: rgba(255,255,255,0.8);
      margin-left: auto;
      transition: color 0.3s;
    }
    .site-nav.scrolled .nav-toggle { color: var(--ink); }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 40px;
    }
    .nav-links a {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #fff; }
    .nav-links a.active { color: var(--peach); }
    .site-nav.scrolled .nav-links a { color: var(--text-label); }
    .site-nav.scrolled .nav-links a:hover { color: var(--ink); }
    .site-nav.scrolled .nav-links a.active { color: var(--accent); }
    /* ── Masthead ── */
    .masthead {
      position: relative;
      height: 80vh;
      min-height: 520px;
      overflow: hidden;
    }
    .masthead-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .masthead::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.70) 60%,
        rgba(0,0,0,0.90) 90%,
        rgba(0,0,0,1) 100%
      );
    }
    .masthead-text {
      position: absolute;
      bottom: 72px;
      left: 5vw;
      z-index: 2;
    }
    .masthead-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(242, 237, 230, 0.68);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .masthead-kicker::before {
      content: '';
      width: 22px;
      height: 1.5px;
      background: linear-gradient(to left, rgb(129, 46, 46), rgb(159, 74, 74), rgb(150, 91, 91));
      flex-shrink: 0;
    }
    .masthead-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 24px rgba(36,22,32,0.5);
    }
    /* ── Content ── */
    .content-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 56px 5vw 88px;
    }
    /* ── Case block ── */
    .case-block {
      background: var(--surface-card);
      border: 1px solid var(--border-mid);
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 32px;
    }
    .case-title-bar {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border-light);
    }
    .case-title-bar h2 {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(1.1rem, 1.6vw, 1.35rem);
      font-weight: 800;
      color: var(--text-heading);
    }
    .case-body {
      padding: 28px;
    }
    /* ── Media grid ── */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .media-card {
      display: block;
      text-decoration: none;
      border: 1px solid var(--border-light);
      border-radius: 0;
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .media-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      border-color: var(--accent-border);
    }
    .media-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .media-card-label {
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-label);
      background: var(--surface-elevated);
      border-top: 1px solid var(--border-mid);
    }
    /* ── Video embed ── */
    .vid-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .vid-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* ── Footer ── */
    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px 5vw;
      border-top: 1px solid var(--border-light);
    }
    .footer-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .footer-social {
      display: flex;
      gap: 20px;
    }
    .footer-social a {
      color: var(--text-muted);
      font-size: 15px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-social a:hover { color: var(--carmine); }
    /* ── Responsive ── */
    @media (max-width: 720px) {
      .nav-toggle { display: block; }
      .site-nav, .site-nav.scrolled { padding: 12px 16px; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%; left: 0; right: 0;
        flex-direction: column;
        background: var(--surface-page);
        border-bottom: 1px solid var(--border-light);
        padding: 12px 20px 16px;
        gap: 0;
        box-shadow: 0 4px 16px rgba(36,22,32,0.08);
      }
      .nav-links.open { display: flex; }
      .nav-links li { padding: 8px 0; border-bottom: 1px solid var(--border-mid); }
      .nav-links li:last-child { border-bottom: none; }
      .nav-links a { font-size: 10px !important; letter-spacing: 0.08em !important; color: var(--text-label) !important; }
      .nav-links a.active { color: var(--accent) !important; }
      .nav-links a:hover { color: var(--ink) !important; }
      .masthead { height: 55vh; min-height: 340px; }
      .masthead-text { left: 20px; bottom: 52px; }
      .content-section { padding: 32px 16px 56px; }
      .media-grid { grid-template-columns: 1fr; }
      .case-body { padding: 20px 16px; }
    }
  </style>
  <style>
    /* dark mode: gold accents */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .nav-links a.active,
      :root:not([data-theme="light"]) .site-nav.scrolled .nav-links a.active { color: var(--gold); }
      :root:not([data-theme="light"]) .case-title-bar {
        border-bottom-color: rgba(242, 237, 230, 0.22);
      }
      :root:not([data-theme="light"]) .media-card:hover {
        box-shadow: 0 6px 20px rgba(0,0,0,0.32);
        border-color: rgba(242, 237, 230, 0.14);
      }
    }
    :root[data-theme="dark"] .nav-links a.active,
    :root[data-theme="dark"] .site-nav.scrolled .nav-links a.active { color: var(--gold); }
    :root[data-theme="dark"] .case-title-bar {
      border-bottom-color: rgba(242, 237, 230, 0.22);
    }
    :root[data-theme="dark"] .media-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.32);
      border-color: rgba(242, 237, 230, 0.14);
    }
  </style>
</head>

<body>

  <nav class="site-nav" id="siteNav">
    <a href="index" class="nav-brand">All Eyes on Delphi</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index">Home</a></li>
      <li><a href="crebin" class="active">Crebin</a></li>
      <li><a href="https://drive.google.com/drive/folders/1NXDYqQ3PAi7KhMC8AjW_2fhSLk9HV11X?usp=drive_link" target="_blank">Google Drive</a></li>
    </ul>
  </nav>

  <div class="masthead">
    <img class="masthead-img" src="assets/gifs/gifs.gif" alt="Crebin">
    <div class="masthead-text">
      <p class="masthead-kicker">IN v. Richard Allen</p>
      <h1 class="masthead-title">Crebin 🦩</h1>
    </div>
  </div>

  <div class="content-section">

    <div class="case-block">
      <div class="case-title-bar">
        <h2>🌈 Welcome to Crebin 🌈</h2>
      </div>
      <div class="case-body">
        <div class="media-grid">
          <a href="gifs" class="media-card">
            <img src="assets/gifs/gifs.gif" alt="Gifs">
            <div class="media-card-label">Gifs</div>
          </a>
          <a href="memes" class="media-card">
            <img src="assets/memes/memes.jpg" alt="Memes">
            <div class="media-card-label">Memes</div>
          </a>
          <a href="mp4s" class="media-card">
            <img src="assets/gifs/mp4s.gif" alt="MP4s">
            <div class="media-card-label">MP4s</div>
          </a>
        </div>
      </div>
    </div>

    <div class="case-block">
      <div class="case-title-bar">
        <h2>Crebin Origin Story</h2>
      </div>
      <div class="case-body">
        <div class="vid-wrap">
          <iframe src="https://drive.google.com/file/d/1kDgKJ2NqUX1oSVyf3kTfQQ14Yco2r4H1/preview" allow="autoplay"></iframe>
        </div>
      </div>
    </div>

  </div>

  <footer class="site-footer">
    <span class="footer-brand">All Eyes on Delphi</span>
    <div class="footer-social">
      <a href="https://www.x.com/alleyesondelphi" target="_blank" aria-label="X / Twitter">𝕏</a>
      <a href="https://www.youtube.com/alleyesondelphi" target="_blank" aria-label="YouTube">▶</a>
    </div>
  </footer>

  <script>
    const nav = document.getElementById('siteNav');
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    });
    toggle.addEventListener('click', () => {
      links.classList.toggle('open');
    });
  </script>

</body>
</html>
